name: Build VIBRA APK
on:
  workflow_dispatch:
  jobs:
    build:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                        - name: Set up Java 17
                                uses: actions/setup-java@v4
                                        with:
                                                  distribution: 'temurin'
                                                            java-version: '17'
                                                                  - name: Setup Node
                                                                          uses: actions/setup-node@v4
                                                                                  with:
                                                                                            node-version: '20'
                                                                                                  - name: Build APK
                                                                                                          run: |
                                                                                                                    npm init -y || true
                                                                                                                              npm install @capacitor/core @capacitor/cli @capacitor/android
                                                                                                                                        rm -rf www
                                                                                                                                                  mkdir www
                                                                                                                                                            cp index.html www/index.html || echo "<h1>VIBRA</h1>" > www/index.html
                                                                                                                                                                      npx cap init VIBRA com.vibra.app --web-dir=www --npm-client npm || true
                                                                                                                                                                                rm -rf android
                                                                                                                                                                                          npx cap add android
                                                                                                                                                                                                    npx cap copy android
                                                                                                                                                                                                              cd android
                                                                                                                                                                                                                        chmod +x gradlew
                                                                                                                                                                                                                                  ./gradlew assembleDebug
                                                                                                                                                                                                                                        - name: Upload APK
                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                  name: app-vibra
                                                                                                                                                                                                                                                                            path: android/app/build/outputs/apk/debug/app-debug.apk