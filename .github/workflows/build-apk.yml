name: Build VIBRA APK
on:
  workflow_dispatch:
  jobs:
    build:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                        - uses: actions/setup-java@v4
                                with:
                                          distribution: 'temurin'
                                                    java-version: '17'
                                                          - name: Setup Android SDK
                                                                  uses: android-actions/setup-android@v3
                                                                        - name: Install Node
                                                                                uses: actions/setup-node@v4
                                                                                        with:
                                                                                                  node-version: '20'
                                                                                                        - name: Build APK
                                                                                                                run: |
                                                                                                                          npm install @capacitor/core @capacitor/cli @capacitor/android
                                                                                                                                    mkdir -p www
                                                                                                                                              echo "<html><body><script>window.location='https://vibra-creator.vercel.app'</script></body></html>" > www/index.html
                                                                                                                                                        npx cap init "Vibra" com.vibra.app --web-dir=www
                                                                                                                                                                  npx cap add android
                                                                                                                                                                            cd android
                                                                                                                                                                                      chmod +x gradlew
                                                                                                                                                                                                ./gradlew assembleDebug
                                                                                                                                                                                                      - uses: actions/upload-artifact@v4
                                                                                                                                                                                                              with:
                                                                                                                                                                                                                        name: app-vibra
                                                                                                                                                                                                                                  path: android/app/build/outputs/apk/debug/app-debug.apk